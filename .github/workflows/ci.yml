name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      DARNA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations match models
        run: |
          DARNA_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres alembic upgrade head
          DARNA_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres alembic check
      - run: pytest -p no:warnings

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build admin and web
        run: |
          npm run build --workspace apps/admin --if-present
          npm run build --workspace apps/web --if-present

  dependency-audit:
    # Known-vulnerability scan of runtime dependencies. Fails on high/critical; lower severities are printed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements*.txt }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - name: Python (pip-audit, runtime requirements)
        working-directory: services/api
        run: |
          pip install "$(grep -i '^pip-audit==' requirements-dev.txt)"
          pip-audit -r requirements.txt
      - name: JavaScript (npm audit, production dependencies)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev || true          # full report, informational
          npm audit --omit=dev --audit-level=high

  e2e:
    # Browser smoke tests for the admin console and public website against a real API + PostgreSQL.
    runs-on: ubuntu-latest
    needs: [api, js]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darna
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DARNA_ENV: development
      DARNA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darna
      DARNA_PUBLIC_BASE_URL: http://localhost:8000
      E2E_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements*.txt }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - name: Start API with synthetic seed data
        working-directory: services/api
        run: |
          # Production requirements only: catches runtime dependencies missing from requirements.txt.
          pip install -r requirements.txt
          alembic upgrade head
          python seed.py
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - run: npm ci
      - name: Install Playwright (same version as the dev environment)
        timeout-minutes: 5
        # No --with-deps: that runs apt-get for extra fonts, which made the job fail on runner DNS outages.
        # GitHub's Ubuntu runners already ship Chrome and the system libraries headless Chromium needs.
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install chromium
      - name: Build and start admin and web
        run: |
          npm run build --workspace apps/admin
          npm run build --workspace apps/web
          nohup npm run start --workspace apps/admin > "$RUNNER_TEMP/admin.log" 2>&1 &
          nohup npm run start --workspace apps/web > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/login && curl -sf -o /dev/null http://localhost:3000/en && break; sleep 1; done
      - name: Admin smoke
        run: NODE_PATH="$(npm root -g)" npm run e2e --workspace apps/admin
      - name: Web smoke
        run: NODE_PATH="$(npm root -g)" npm run e2e --workspace apps/web
      - name: Server logs on failure
        if: failure()
        run: |
          for f in api admin web; do
            echo "=== $f.log ==="; tail -n 80 "$RUNNER_TEMP/$f.log" 2>/dev/null || echo "(not started)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
