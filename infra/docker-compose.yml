# Local development stack. NOT a production deployment.
# Usage: docker compose -f infra/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: darna
      POSTGRES_USER: darna
      POSTGRES_PASSWORD: darna-local-only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darna"]
      interval: 3s
      retries: 20
  migrate:
    build: ../services/api
    command: ["alembic", "upgrade", "head"]
    environment: &apienv
      DARNA_ENV: development
      DARNA_DATABASE_URL: postgresql+psycopg://darna:darna-local-only@db:5432/darna
      DARNA_PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ../services/api
    environment: *apienv
    ports: ["8000:8000"]
    volumes: [storage:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: ../services/api
    # Offer expiry, document retention purge, featured expiry, token cleanup every 5 minutes.
    command: ["python", "-m", "app.worker", "--interval", "300"]
    environment: *apienv
    volumes: [storage:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
  storage:
